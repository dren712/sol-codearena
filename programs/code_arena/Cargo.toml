[package]
name = "code_arena"
version = "0.1.0"
description = "Solana Code Arena On-Chain Achievement and Verification Registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "code_arena"

[features]
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# `init-if-needed` powers the duplicate-completion guard in `record_completion`.
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
